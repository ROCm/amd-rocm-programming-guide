name: Linting

on:
  push:
    branches:
    - develop
    - main
    - 'docs/*'
    - 'roc**'
  pull_request:
    branches:
    - develop
    - main
    - 'docs/*'
    - 'roc**'

jobs:
  call-workflow-passing-data:
    name: Documentation
    permissions:
      contents: read
    uses: ROCm/rocm-docs-core/.github/workflows/linting.yml@17417d0101a0406787e585a07863056f3b142a78 # develop
