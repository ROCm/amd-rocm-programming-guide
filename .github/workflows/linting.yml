name: Linting

on:
  push:
    branches:
    - develop
    - main
    - 'docs/*'
    - 'roc**'
  pull_request:
    branches:
    - develop
    - main
    - 'docs/*'
    - 'roc**'

jobs:
  call-workflow-passing-data:
    name: Documentation
    permissions:
      contents: read
    uses: ROCm/rocm-docs-core/.github/workflows/linting.yml@ade2da717de3622eaca1daf602609779e4feea7e # develop
