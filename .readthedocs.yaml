# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

sphinx:
   configuration: docs/conf.py

formats: [htmlzip, pdf]

python:
   install:
   - requirements: docs/sphinx/requirements.txt

build:
   os: ubuntu-24.04
   tools:
      python: "3.12"
   apt_packages:
     - doxygen
     - gfortran # For pre-processing fortran sources
     - graphviz # For dot graphs in doxygen
     - inkscape # For converting SVG to PDF in LaTeX builds
   jobs:
     pre_build:
       # Fail the PDF build fast on a missing image or font instead of
       # hanging on xelatex's interactive prompt until the build times out.
       - export LATEXOPTS="-interaction=batchmode -halt-on-error"
